name: Feature / Task
description: New functionality or a piece of work for a sprint.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Start the title with the area:
        - Code: `core:`, `cli:`, `ui:`, `desktop:`, `ext:`, `server:`, `tui:`
        - Other work: `ci:` (workflows, checks), `docs:` (documentation), `chore:` (tooling, dependencies, cleanup)

        Add the matching area label after creating the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be done and why?
      placeholder: Add a generator for random usernames, so users don't have to come up with one themselves.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Approach, open questions, links, screenshots (optional).
    validations:
      required: false
