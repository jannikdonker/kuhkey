[package]
name = "kuhkey_ext"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kuhkey_core = { path = "../kuhkey_core" }
dioxus = { version = "0.7", features = ["web"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Clipboard", "Navigator", "Window"] }
gloo-timers = { version = "0.3", features = ["futures"] }
uuid = "1"

# psw gen needs random numbers, in the browser getrandom only gets them through js
# with the wasm_js feature (only for wasm builds)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
