[package]
name = "kuhkey_ext"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kuhkey_core = { path = "../kuhkey_core" }
wasm-bindgen = "0.2"

# psw gen needs random numbers, in the browser getrandom only gets them through js
# with the wasm_js feature (only for wasm builds)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
