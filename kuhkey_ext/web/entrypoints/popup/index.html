<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KuhKey</title>
    <meta name="manifest.type" content="browser_action" />
  </head>
  <body>
    <!-- login frontend only-->
    <form id="login" class="login-box">
      <img class="login-cow" alt="KuhKey cow" />
      <div class="title">KuhKey</div>
      <div class="login-subtitle">Your Password Manager</div>

      <div class="login-card">
        <div class="field">
          <div class="field-label">Username</div>
          <input id="login-username" class="login-input" type="text" placeholder="Username" autocomplete="username" spellcheck="false" autofocus />
        </div>
        <div class="field">
          <div class="field-label">Password</div>
          <input id="login-password" class="login-input" type="password" placeholder="Password" autocomplete="current-password" />
        </div>
      </div>

      <button class="field-edit primary login-button" type="submit">Log in</button>
    </form>

    <header class="title-box" hidden>
      <div class="title">KuhKey</div>
      <div class="title-actions">
        <div class="subtitle">Your Password Manager</div>
        <button id="add-entry" class="add-button" type="button" title="Add a new password">+ Add</button>
      </div>
    </header>

    <main class="layout" hidden>
      <nav id="entries" class="entry-list"></nav> <!--left-->

      <section id="detail" class="detail">
      </section> <!--right 50%-->
      <div class="copy-notify"><h2></h2></div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
