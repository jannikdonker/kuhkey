[package]
name = "kuhkey_server"
version = "0.1.0"
edition = "2024"

[dependencies]
kuhkey_core = { path = "../kuhkey_core" }
anyhow = "1.0.105"
axum = { version = "0.8.9", features = [] }
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
