[package]
name = "kuhkey_ttt"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
kuhkey_core = { path = "../kuhkey_core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# ureq needs real sockets, so leave it out of wasm builds or the browser ext wont build
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.5.2", features = ["json"] }
